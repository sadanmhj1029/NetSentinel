# NetSentinel -- full stack. `docker compose up --build` gets you
# Postgres + the FastAPI backend (simulator, collector, detection, ML,
# correlation, incident engine, scheduler, WebSocket) + the React
# frontend, wired together. See docs/DEPLOYMENT.md for details,
# troubleshooting, and the non-Docker local-dev alternative.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netsentinel}
      POSTGRES_DB: ${POSTGRES_DB:-netsentinel}
    volumes:
      - netsentinel_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netsentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-netsentinel}:${POSTGRES_PASSWORD:-netsentinel}@db:5432/${POSTGRES_DB:-netsentinel}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      COLLECTOR_STALE_AFTER_SECONDS: ${COLLECTOR_STALE_AFTER_SECONDS:-10}
      POLLING_MODE: ${POLLING_MODE:-simulated}
      RULE_CONSECUTIVE_FAILS: ${RULE_CONSECUTIVE_FAILS:-3}
      RULE_CONSECUTIVE_RECOVERIES: ${RULE_CONSECUTIVE_RECOVERIES:-3}
      RULE_PACKET_LOSS_PCT: ${RULE_PACKET_LOSS_PCT:-10}
      RULE_HIGH_CPU_PCT: ${RULE_HIGH_CPU_PCT:-90}
      RULE_HIGH_MEMORY_PCT: ${RULE_HIGH_MEMORY_PCT:-90}
      RULE_HIGH_LATENCY_MS: ${RULE_HIGH_LATENCY_MS:-150}
      ML_MIN_TRAINING_SAMPLES: ${ML_MIN_TRAINING_SAMPLES:-200}
      ML_ANOMALY_CONTAMINATION: ${ML_ANOMALY_CONTAMINATION:-0.05}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_EMAIL_ENABLED: ${NOTIFY_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-netsentinel@companya.com}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-operator123}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-viewer123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - netsentinel_ml_models:/app/ml_models

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  netsentinel_db_data:
  netsentinel_ml_models:
